<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>실시간 대기오염정보 조회 서비스 (Responsive)</title> 
</head>
<body>
    <div class="container-fluid p-3"> 

        <div class="row mb-3">
            <div class="col-12">
                <div id="title" class="text-center bg-primary text-white p-2 rounded">
                    <span class="fs-4 fw-bold">실시간 대기오염정보 조회 서비스</span>
                </div>
            </div>
        </div>

        <div class="row">

            <div id="block1" class="col-12 col-lg-8 mb-3">
                <div id="map" style="width: 100%; height: 500px; border: 1px solid #dee2e6;" class="rounded"></div>
            </div>

            <div class="col-12 col-lg-4">
                
                <div id="block2" class="card mb-3">
                    <div class="card-body">
                        <select name="location" class="form-select mb-2" onChange="selectLoc(this.value);">
                            <option value="">지역선택</option>
                            <option value="서울특별시">서울</option>
                            <option value="부산광역시">부산</option>
                            <option value="대구광역시">대구</option>
                            <option value="인천광역시">인천</option>
                            <option value="광주광역시">광주</option>
                            <option value="대전광역시">대전</option>
                            <option value="울산광역시">울산</option>
                            <option value="경기도">경기도</option>
                            <option value="강원도">강원도</option>
                            <option value="충청북도">충청북도</option>
                            <option value="충청남도">충청남도</option>
                            <option value="전라북도">전라북도</option>
                            <option value="전라남도">전라남도</option> 
                            <option value="경상북도">경상북도</option>
                            <option value="경상남도">경상남도</option>
                            <option value="제주특별자치도">제주</option>
                        </select>       
                        
                        <div class="d-flex justify-content-between">
                            <button id="myloc" class="btn btn-primary w-50 me-2" onclick="moveTomyLocation();">내위치</button> 
                            <label id="myloctext" class="form-control text-center w-50">현재위치</label>
                        </div>
                    </div>
                </div>

                <div id="block3" class="card">
                    <div class="card-header bg-secondary text-white fw-bold">
                        실시간 대기오염정보
                    </div>
                    <div class="card-body p-0">
                        <table class="table table-bordered table-striped mb-0">
                            <tbody>
                                <tr>
                                    <th>측정날짜</th>
                                    <td id="d_1">로딩중</td>
                                </tr>
                                <tr>
                                    <th>측정소</th>
                                    <td id="d_2">로딩중</td>
                                </tr>
                                <tr>
                                    <th>통합지수</th>
                                    <td id="d_3">로딩중</td>
                                </tr>
                                <tr>
                                    <th>미세먼지</th>
                                    <td id="d_4">로딩중</td>
                                </tr>
                                <tr>
                                    <th>오존</th>
                                    <td id="d_5">로딩중</td>
                                </tr>
                                <tr>
                                    <th>일산화 탄소</th>
                                    <td id="d_6">로딩중</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=4814ed8a155625b106019a927589e555&libraries=services"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript" src="dust_template.js"></script>
</body>
</html>
